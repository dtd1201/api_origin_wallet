[program:origin_wallet_worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/origin_wallet
command=/usr/bin/php8.3 /var/www/origin_wallet/artisan queue:work --queue=default,nium-va-details --sleep=3 --tries=3 --timeout=60 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/origin_wallet/storage/logs/worker.log
stopwaitsecs=3600
